title: Makerly Paper Co.
tagline: Useful digital tools that work on day one.
description: Plain how-to guides for budgets, planners, spreadsheets and templates, from a small shop that makes and tests every product.
url: https://makerlypaperco.github.io
baseurl: ""
lang: en
permalink: /blog/:title/
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
logo: /assets/img/brand/logo-mark-256.png
image: /assets/img/brand/social-card-1200x630.png
shop_url: https://makerlypaperco.gumroad.com
starter_url: https://makerlypaperco.gumroad.com/l/beginner-budget-starter
social:
  name: Makerly Paper Co.
  links:
    - https://makerlypaperco.gumroad.com
    - https://www.pinterest.com/makerlypaperco/
    - https://www.tumblr.com/makerlypaperco
topics: [Planners, Spreadsheets, Templates, Printables, Notion, Creative assets]
exclude: [README.md]
# Pinterest (GOS skill 40 pinterest-method): every pin links to its own page under /pins/, made by GOS with
# the pin's image and text and one button to the product; the pins reach Pinterest through the RSS feeds in
# /feeds/ (one feed per board). The pages are thin on purpose: kept out of the sitemap and of Google.
defaults:
  - scope:
      path: "pins"
    values:
      layout: pin
      sitemap: false
      robots: "noindex, follow"
      seo:
        type: article
