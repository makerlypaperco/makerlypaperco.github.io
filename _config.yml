title: Makerly Paper Co.
tagline: Useful digital tools that work on day one.
description: Plain how-to guides for budgets, planners, spreadsheets and templates, from a small shop that makes and tests every product.
url: https://makerlypaperco.github.io
baseurl: ""
lang: en
# Byline of every post (GOS skill 16 blog-seo 2.0.0): the shop, never an invented person.
author: Makerly Paper Co.
permalink: /blog/:title/
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
logo: /assets/img/brand/logo-mark-256.png
image: /assets/img/brand/social-card-1200x630.png
# Gumroad links carry UTM tags (GOS skill traffic-data) so Gumroad analytics shows the blog as the source.
shop_url: https://makerlypaperco.gumroad.com/?utm_source=blog&utm_medium=site&utm_campaign=shop
starter_url: https://makerlypaperco.gumroad.com/l/beginner-budget-starter?utm_source=blog&utm_medium=site&utm_campaign=free-starter
# Every Makerly profile, in the order shown in the footer, the About page and under each post.
# A profile with an empty url is hidden (Bluesky: fill in once the account exists).
profiles:
  - name: Instagram
    url: https://www.instagram.com/makerlypaper.co/
  - name: Threads
    url: https://www.threads.com/@makerlypaper.co
  - name: Pinterest
    url: https://www.pinterest.com/makerlypaperco/
  - name: X
    url: https://x.com/MakerlyPaperCo
  - name: Tumblr
    url: https://www.tumblr.com/makerlypaperco
  - name: Medium
    url: https://medium.com/@MakerlyPaperCompany
  - name: Bluesky
    url: ""
# Profiles Google may tie to this site (jekyll-seo-tag sameAs); keep in step with `profiles`.
social:
  name: Makerly Paper Co.
  links:
    - https://makerlypaperco.gumroad.com
    - https://www.instagram.com/makerlypaper.co/
    - https://www.threads.com/@makerlypaper.co
    - https://www.pinterest.com/makerlypaperco/
    - https://x.com/MakerlyPaperCo
    - https://www.tumblr.com/makerlypaperco
    - https://medium.com/@MakerlyPaperCompany
topics: [Planners, Spreadsheets, Templates, Printables, Notion, Creative assets]
exclude: [README.md]
# Pinterest (GOS skill 40 pinterest-method): every pin links to its own page under /pins/, made by GOS with
# the pin's image and text and one button to the product; the pins reach Pinterest through the RSS feeds in
# /feeds/ (one feed per board). The pages are thin on purpose: kept out of the sitemap and of Google.
defaults:
  - scope:
      path: "pins"
    values:
      layout: pin
      sitemap: false
      robots: "noindex, follow"
      seo:
        type: article
